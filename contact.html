<body class="contact-page">
  <nav>
    <ul class="nav-bar">
      <li><a href="home.html">Home</a></li>
      <li><a href="bio.html">Bio</a></li>
      <li><a href="works.html">Works</a></li>
      <li><a href="other.html">Other</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section id="contact-info">
      <header>
        <h1>Get In Touch</h1>
        <p>For collaborations, work inquiries, or further questions, the contact form is preferred. </p>
      </header>

      <div class="contact-block social">
        <h2>Socials</h2>
        <ul class="contact-links">
          <li><a href="https://www.instagram.com/joshp.wav/" target="_blank">Instagram</a></li>
          <li><a href="https://www.last.fm/user/ProsaicOpinion" target="_blank">last.fm</a></li>
          <li><a href="https://www.linkedin.com/in/joshua-procell-2a5a9617b/" target="_blank">LinkedIn</a></li>
        </ul>
      </div>

      <div class="contact-block">
        <h2>Contact Me</h2>

        <form action="https://formspree.io/f/xreqygbe" method="POST" data-recaptcha="true" class="contact-form">

          <!-- Honeypot spam trap -->
          <input type="text" name="_gotcha" style="display:none">

          <input type="text" name="name" placeholder="Your Name" required>

          <input type="email" name="email" placeholder="Your Email" required>

          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>

          <button type="submit">Send Message</button>

        </form>
      </div>

      <div class="contact-block">
        <p>
          
        </p>
      </div>
    </section>
  </main>

</body>
