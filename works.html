<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Josh — Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/works-page.css">
  <link rel="stylesheet" href="css/waveform.css"> 
  <script src="js/filtering.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/mini-waveform.js" defer></script>
</head>
<body class="works-page">

  <nav>
    <ul class="nav-bar">
      <li><a href="home.html">Home</a></li>
      <li><a href="bio.html">Bio</a></li>
      <li><a href="works.html" class="active">Works</a></li>
      <li><a href="other.html">Other</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>

    <section id="works-content">
      <h1>Sounds and Projects</h1>
      <p>Various projects or exercises I have worked on, or been fortunate to contribute to alongside others.</p>
    </section>

    <!-- Filter bar -->
    <div id="filter-bar">
      <button data-category="all" class="active">All</button>
      <button data-category="synthesis">Synthesis</button>
      <button data-category="sound-design">Sound Design</button>
      <button data-category="albums">Albums</button>
    </div>

    <!-- Grid container for project modules -->
    <section id="works-gallery">
      <div class="project-card" data-project="foley" data-category="sound-design">
        <img src="images/foley-cover-1000.jpg" alt="Foley Project Cover">
      </div>

      <div class="project-card" data-project="fm" data-category="synthesis">
        <img src="images/fm-cover-1000.jpg" alt="FM Project Cover">
      </div>
      
      <div class="project-card" data-project="sampling" data-category="synthesis">
        <img src="images/simpler-cover-1500.jpg" alt="Sampling Project Cover">
      </div>

      <div class="project-card" data-project="toasc" data-category="albums">
        <img src="images/toasc-cover-1500.jpg" alt="ToaSC Cover">
      </div>

      <div class="project-card" data-project="generative" data-category="sound-design">
        <img src="images/generative-cover-1500.jpg" alt="Generative Project Cover">
      </div>

      <div class="project-card" data-project="presets" data-category="synthesis">
        <img src="images/presets-cover-1500.jpg" alt="Presets Project Cover">
      </div>

      <div class="project-card" data-project="disavowal" data-category="albums">
        <img src="images/disavowal-cover-1500.jpg" alt="Disavowal Cover">
      </div>

      <div class="project-card" data-project="notifications" data-category="sound-design">
        <img src="images/notifications-cover-1500.jpg" alt="Notifications Project Cover">
      </div>

      <div class="project-card" data-project="analog-drums" data-category="synthesis">
        <img src="images/analog-drums-cover-1500.jpg" alt="Analog Drums Project Cover">
      </div>

      <div class="project-card" data-project="sound-logos" data-category="sound-design">
        <img src="images/sound-logos-cover-1500.jpg" alt="Sound Logos Project Cover">
      </div>

      <div class="project-card" data-project="collision" data-category="sound-design">
        <img src="images/collision-cover-1000.jpg" alt="Collision Project Cover">
      </div>

      <div class="project-card" data-project="layering" data-category="synthesis">
        <img src="images/layering-cover-1000.jpg" alt="Layering Project Cover">
      </div>

      <!-- Add more project cards as needed -->
    </section>

    <!-- Modal for project details -->
    <div id="project-modal" class="hidden">
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div class="modal-body">
          <!-- Content injected dynamically via JS -->
        </div>
      </div>
    </div>


  </main>

  <!-- Mini floating waveform -->
  <div id="mini-waveform"></div>

</body>
</html>
