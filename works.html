<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Josh — Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/player.js" defer></script>
  <script src="js/filtering.js" defer></script>
  <script src="js/prevent.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/mini-waveform.js" defer></script>
</head>
<body class="works-page">

  <nav>
    <ul class="nav-bar">
      <li><a href="index.html">Home</a></li>
      <li><a href="bio.html">Bio</a></li>
      <li><a href="works.html" class="active">Works</a></li>
      <li><a href="other.html">Other</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section id="works-content">
      <h1>Work Samples</h1>
      <p>Various projects I've done or was a part of.</p>
    </section>

    <!-- Filter bar -->
    <div id="filter-bar">
      <button data-category="all" class="active">All</button>
      <button data-category="synthesis">Synthesis</button>
      <button data-category="sound-design">Sound Design</button>
    </div>

    <!-- Grid container for project modules -->
    <section id="works-gallery">
      <div class="project-card" data-project="foley" data-category="sound-design">
        <img src="images/foley-cover-1000.jpg" alt="Foley Project Cover">
      </div>

      <div class="project-card" data-project="sampling" data-category="synthesis">
        <img src="images/simpler-cover-1500.jpg" alt="Sampling Project Cover">
      </div>

      <div class="project-card" data-project="collision" data-category="sound-design">
        <img src="images/collision-cover-1000.jpg" alt="Collision Project Cover">
      </div>

      <!-- Add more project cards as needed -->
    </section>

    <!-- Modal for project details -->
    <div id="project-modal" class="hidden">
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div class="modal-body">
          <!-- Content injected dynamically via JS -->
        </div>
      </div>
    </div>


  </main>

  <!-- Mini floating waveform -->
  <div id="mini-waveform"></div>

</body>
</html>
